<!DOCTYPE html>
<!-- 声明当前文档类型为 HTML5，确保浏览器按最新标准解析页面 -->
<html lang="zh-CN">
  <!-- html 根标签，lang="zh-CN" 表示页面语言为中文简体 -->
  <head>
    <!-- head 部分用于声明页面元信息、样式文件和标题等 -->
    <meta charset="UTF-8" />
    <!-- 设置网页字符编码为 UTF-8，保证中文内容正常显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- viewport 用于让页面在移动端按设备宽度进行缩放，适配不同屏幕 -->
    <title>个人名片</title>
    <!-- 浏览器标签页标题，显示在页面标题栏或标签页中 -->

    <!-- 引入外部样式表，保证 HTML 结构与 CSS 样式分离，便于维护 -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- body 是页面主体内容区域，所有可见内容都放在这里 -->

    <!-- main 用于表示页面的核心内容，通常放在最外层用于页面布局 -->
    <main class="card-wrap">
      <!-- card-wrap：名片整体容器，负责让卡片在页面中间显示 -->

      <!-- article 语义化标签，表示这块是独立的名片内容区域 -->
      <article class="business-card">
        <!-- business-card：名片主体盒子，包含头像、姓名、职位和联系方式 -->

        <!-- 头像外层容器，用于控制圆形头像的展示效果 -->
        <div class="avatar-wrap">
          <!-- img 标签用于放置头像图片，alt 作为图片的替代文本 -->
          <img
            src="D:\asus\Pictures\Saved Pictures\OIP-C.jpg"
            alt="个人头像"
          />
        </div>

        <!-- h1 用于展示姓名，页面中通常只有一个主标题 -->
        <h1 class="name">梁广阳</h1>

        <!-- p 标签用于展示个人职业或职位信息 -->
        <p class="title">前端工程师</p>

        <!-- 联系方式列表，用于展示邮箱、电话和网站等信息 -->
        <ul class="contact-list">
          <!-- 每个 li 表示一条联系方式信息 -->
          <li>
            <!-- 标签名称，如“邮箱” -->
            <span>邮箱</span>
            <!-- 邮箱链接，点击可直接发邮件 -->
            <a href="mailto:1011193907@qq.com">1011193907@qq.com</a>
          </li>

          <li>
            <span>电话</span>
            <!-- tel 链接可在移动端拨打电话 -->
            <a href="tel:+8613800000000">+86 138 0000 0000</a>
          </li>

          <li>
            <span>网站</span>
            <!-- target="_blank" 表示在新标签页打开网站 -->
            <a href="https://example.com" target="_blank" rel="noreferrer">www.example.com</a>
          </li>
        </ul>
      </article>
    </main>
  </body>
</html>
